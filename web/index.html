<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Androidのホーム画面に「アプリ」として追加できるようにする -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b5fb4">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>道路マップ</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #1d2433; --muted: #5b6577; --line: #d9dee7; --soft: #f4f6fa;
    --k1: #1f5fbf; --k2: #e8780c; --k3: #d63333; --k4: #8a3fc2;
    --kosoku: #3d4451; --senyo: #7a8494; --shuyo: #1e8a4c; --ippan: #c98a00; --junction: #1d2433;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; left: 12px; top: 12px; z-index: 2; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 250px;
    box-shadow: 0 2px 10px rgba(0,0,0,.12); font-size: 13px; max-height: calc(100vh - 24px); overflow-y: auto; }
  .panel h1 { font-size: 15px; margin: 0 0 8px; }
  .panel label { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; }
  .sw { width: 22px; height: 5px; border-radius: 3px; display: inline-block; flex: none; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; margin: 2px 0 6px 28px;
    font-size: 12px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 16px; height: 4px; border-radius: 2px; display: inline-block; }
  .status { margin-top: 8px; color: var(--muted); font-size: 12px; min-height: 1.2em; }
  button { font: inherit; }
  .panel .btn { margin-top: 6px; width: 100%; padding: 6px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--soft); font-size: 12px; cursor: pointer; color: var(--fg); }
  /* パックマン */
  #pacCanvas { position: absolute; inset: 0; z-index: 10; touch-action: none; }
  #pacHud { position: absolute; inset: 0; z-index: 11; pointer-events: none; color: #fff; font-size: 13px; }
  #pacScore { position: absolute; left: 12px; top: 10px; font-weight: 600; text-shadow: 0 1px 2px #000; }
  #pacLives { position: absolute; left: 12px; top: 30px; color: #ffd43b; letter-spacing: 3px; }
  #pacHud button { pointer-events: auto; position: absolute; top: 8px; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.4); background: rgba(0,0,0,.4); color: #fff; font-size: 15px; cursor: pointer; }
  #pacPause { right: 52px; } #pacQuit { right: 10px; }
  #pacMsg { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); background: rgba(0,0,0,.65); padding: 10px 18px;
    border-radius: 12px; font-size: 15px; font-weight: 600; text-align: center; transition: opacity .4s; opacity: 0; max-width: 85%; }
  .pacBtns { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .pacBtns button { pointer-events: auto; position: static !important; width: auto !important; height: auto !important;
    border-radius: 18px !important; padding: 6px 14px; font-size: 13px !important; }
  body.pacmode .panel, body.pacmode #focusChip, body.pacmode .maplibregl-ctrl-top-right { display: none; }
  /* 訪問記録 */
  .vpop { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  .vbadge { background: #2b8a3e; color: #fff; border-radius: 10px; padding: 1px 8px; font-weight: 600; }
  .vnone { color: var(--muted); }
  .vopen { margin-left: auto; border: 0; background: #d9480f; color: #fff; border-radius: 14px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
  #visitSheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; }
  #visitSheet[hidden], #photoViewer[hidden] { display: none; }
  .sheetbox { background: var(--bg); width: min(520px, 100%); max-height: 88vh; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 14px 16px 24px; box-sizing: border-box; }
  .sheettop { display: flex; align-items: center; }
  .sheettop h3 { margin: 0; font-size: 17px; flex: 1; }
  .sheetclose { border: 0; background: var(--soft); border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }
  .vsum { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
  #vform { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--soft); border-radius: 10px; }
  .vlab { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  #vform input[type=date], #vform textarea { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .vbtn { align-self: flex-start; border: 1px solid var(--line); background: var(--bg); border-radius: 16px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .vsave { border: 0; background: #d9480f; color: #fff; border-radius: 8px; padding: 9px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .vph { display: flex; flex-wrap: wrap; gap: 6px; }
  .vph img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; cursor: pointer; }
  .pend { position: relative; }
  .pend button { position: absolute; top: -6px; right: -6px; border: 0; background: #1d2433; color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 10px; cursor: pointer; }
  .vlist { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .vrec { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .vhead { display: flex; align-items: center; }
  .vhead b { flex: 1; }
  .vdel { border: 0; background: none; color: #c92a2a; font-size: 12px; cursor: pointer; }
  .vcom { font-size: 13px; margin: 4px 0 6px; line-height: 1.5; }
  #photoViewer { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.9); display: flex; align-items: center; justify-content: center; }
  #photoViewer img { max-width: 100%; max-height: 100%; }
  .rsum { font-size: 14px; margin: 4px 0; }
  .rsum b { font-size: 22px; color: #d9480f; }
  .rbar { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .rbar i { display: block; height: 100%; background: #d9480f; }
  .vfilter { font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .vfilter label { margin: 0; gap: 3px; }
  .rlist { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; }
  .rrow { display: flex; justify-content: space-between; gap: 8px; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 7px 2px; text-align: left; cursor: pointer; font-size: 13px; color: var(--fg); }
  .rrow small { color: var(--muted); white-space: nowrap; }
  .offinfo { font-size: 12px; color: var(--muted); margin: 2px 0 4px; line-height: 1.5; }
  .panel .btn.primary { background: var(--k1); border-color: var(--k1); color: #fff; }
  .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .tabs button { flex: 1; padding: 5px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); cursor: pointer; font-size: 12px; color: var(--muted); }
  .tabs button.on { background: var(--k1); border-color: var(--k1); color: #fff; }
  #q { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 6px; font-size: 13px; background: var(--soft); }
  .row { display: flex; gap: 6px; }
  .row .btn { flex: 1; }
  #sellist { max-height: 300px; overflow-y: auto; margin-top: 8px; border-top: 1px solid var(--line); }
  #sellist h2 { font-size: 11px; color: var(--muted); margin: 8px 0 2px; font-weight: 600; }
  #sellist .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 4px; }
  #sellist .names label { margin: 3px 0; }
  #sellist label { margin: 2px 0; gap: 4px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 12px; padding: 8px 0; }
  .badge { background: #fff; color: var(--k1); border-radius: 8px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
  .stylerow { display: grid; grid-template-columns: 1fr 34px 112px; gap: 6px; align-items: center; margin: 5px 0; }
  .stylerow input[type=color] { width: 34px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
  .stylerow select { font-size: 12px; padding: 3px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
  .presets { display: flex; gap: 6px; margin-bottom: 6px; }
  .presets .btn { margin-top: 0; }
  svg.sw { width: 28px; height: 10px; flex: none; vertical-align: middle; }
  #toggle { display: none; }
  @media (max-width: 600px) {
    .panel { left: 8px; right: 8px; top: auto; bottom: 24px; width: auto; }
    .panel.collapsed .body { display: none; }
    #toggle { display: block; position: absolute; right: 10px; top: 8px; width: auto; margin: 0;
      padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); }
    #sellist { max-height: 180px; }
  }
  .maplibregl-popup-content { font-size: 13px; line-height: 1.5; }
  #focusChip { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 3;
    background: #1d2433; color: #fff; border-radius: 18px; padding: 6px 8px 6px 14px; font-size: 13px;
    display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.25); max-width: 80vw; }
  #focusChip[hidden] { display: none; }
  #focusChip button { border: 0; background: rgba(255,255,255,.18); color: #fff; border-radius: 50%;
    width: 24px; height: 24px; cursor: pointer; font-size: 12px; }
  .trace { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .trace button { border: 1px solid #d9dee7; background: #fff8db; border-radius: 12px; padding: 2px 9px;
    font-size: 12px; cursor: pointer; }
  @media (max-width: 600px) { #focusChip { top: 8px; font-size: 12px; } }
  .panel h3 { font-size: 12px; color: var(--muted); margin: 10px 0 2px; font-weight: 600; }
  .ficon { width: 18px; height: 18px; border-radius: 4px; color: #fff; font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 2px; }
  .chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 2px 8px;
    font-size: 11px; cursor: pointer; color: var(--fg); }
  .chips button.on { background: var(--k1); border-color: var(--k1); color: #fff; }
  .eki h4 { margin: 0 0 2px; font-size: 15px; }
  .eki .sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .fac { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin: 6px 0; }
  .fac div { border-radius: 5px; background: #1c7ed6; color: #fff; text-align: center; padding: 3px 0 2px;
    font-size: 9px; line-height: 1.2; }
  .fac div b { display: block; font-size: 16px; font-weight: normal; line-height: 1.2; }
  .fac div.off { background: #ced4da; color: #fff; }
  .fac.rest { grid-template-columns: repeat(5, 1fr); }
  .fac.rest div { background: #e8a200; }
  .fac.rest div.off { background: #ced4da; }
  .fac div.off b { filter: grayscale(1); opacity: .55; }
</style>
</head>
<body>
<div id="map"></div>
<div id="focusChip" hidden><span id="focusText"></span><button id="focusClose" aria-label="強調を解除">✕</button></div>
<div class="panel" id="panel">
  <button id="toggle">▼</button>
  <h1>道路マップ</h1>
  <div class="body">
    <div class="tabs">
      <button data-tab="view" class="on">表示</button>
      <button data-tab="select">道路を選択<span class="badge" id="selcount" hidden></span></button>
      <button data-tab="record">記録</button>
      <button data-tab="style">配色</button>
    </div>

    <div id="tab-view">
      <label><input type="checkbox" data-cls="kokudo" checked><span data-sw="k1"></span>国道</label>
      <div class="legend">
        <span><span data-sw="k1"></span>単独</span><span><span data-sw="k2"></span>二重用</span>
        <span><span data-sw="k3"></span>三重用</span><span><span data-sw="k4"></span>四重用以上</span>
      </div>
      <label><input type="checkbox" data-cls="shuyo" checked><span data-sw="shuyo"></span>主要地方道</label>
      <label><input type="checkbox" data-cls="ippan" checked><span data-sw="ippan"></span>一般都道府県道</label>
      <label><input type="checkbox" data-cls="kosoku" checked><span data-sw="kosoku"></span>高速道路</label>
      <label><input type="checkbox" data-cls="senyo" checked><span data-sw="senyo"></span>自動車専用道路</label>
      <label><input type="checkbox" id="endpoints" checked><span style="width:28px;display:inline-flex;justify-content:center"><span style="width:9px;height:9px;border-radius:50%;border:2.5px solid var(--k1);background:#fff"></span></span>国道の起点・終点を表示</label>
      <label><input type="checkbox" id="overlap" checked><span style="width:28px;display:inline-flex;justify-content:center"><span style="width:6px;height:6px;border-radius:50%;background:#5b6577"></span></span>重用区間の端を表示</label>
      <label><input type="checkbox" id="labels" checked>路線番号の標識を表示</label>
      <label><input type="checkbox" id="names" checked>通り名・通称名を表示</label>
      <button class="btn primary" id="pacStart">🎮 この画面でパックマン</button>
      <h3>道路データの保存</h3>
      <div id="offline"><div class="empty">確認中…</div></div>
      <h3>施設</h3>
      <label><input type="checkbox" id="showRest" checked><span class="ficon" style="background:#ffd43b;color:#1d2433;border:1.5px solid #1d2433;box-sizing:border-box">SA</span>サービスエリア・パーキングエリア</label>
      <label><input type="checkbox" id="showEki" checked><span class="ficon" style="background:#d9480f">駅</span>道の駅</label>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">道の駅を設備で絞り込み</div>
      <div class="chips" id="facChips"></div>
    </div>

    <div id="tab-select" hidden>
      <input id="q" type="search" placeholder="番号・県名・通り名で検索（例: 16、千葉、千葉街道）">
      <div class="row">
        <button class="btn" id="fit">選んだ道路へ移動</button>
        <button class="btn" id="clear">選択を解除</button>
      </div>
      <div id="sellist"></div>
    </div>

    <div id="tab-record" hidden></div>

    <div id="tab-style" hidden>
      <div class="presets">
        <button class="btn" data-preset="color">カラー（標準）</button>
        <button class="btn" data-preset="cud">色覚配慮（色＋線種）</button>
      </div>
      <div class="presets">
        <button class="btn" data-preset="mono">白黒・線種A</button>
        <button class="btn" data-preset="mono2">白黒・線種B（丸）</button>
      </div>
      <label style="margin:8px 0 4px">標識マークの色
        <select id="signColor" style="margin-left:auto;font-size:12px;padding:3px;border:1px solid var(--line);border-radius:4px">
          <option value="real">本物の標識（国道・都道府県道は青、高速は緑）</option>
          <option value="line">線の色に合わせる</option>
        </select></label>
      <div id="stylerows"></div>
    </div>

    <div class="status" id="status"></div>
  </div>
</div>
<script>
// ===== 設定 =====
// 事前に作った全国の道路タイル（GitHub Actionsで毎月更新）
// Androidアプリでは、Actionsが "__DATA_BASE__" を公開ページのURLに置き換える
const APP_DATA_BASE = "__DATA_BASE__";
const IS_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const DATA_BASE = IS_APP && !APP_DATA_BASE.startsWith("__") ? APP_DATA_BASE : new URL("./", location.href).href;
const TILES = new URL("japan-roads.pmtiles", DATA_BASE).href;
const INDEX_URL = new URL("index.json", DATA_BASE).href;
const CLASS_OF = { motorway: "kosoku", trunk: "kokudo", primary: "shuyo", secondary: "ippan" };
const CLASS_NAME = { kosoku: "高速道路", senyo: "自動車専用道路", kokudo: "国道", shuyo: "主要地方道", ippan: "一般都道府県道" };
// 表示カテゴリ（国道は重用数で4つに分ける）
const nrefB = ["min", ["max", ["get", "nref"], 1], 4];
const CATS = [
  { id: "ippan",  cls: "ippan",  name: "一般都道府県道", w: 1.4 },
  { id: "shuyo",  cls: "shuyo",  name: "主要地方道",     w: 2.2 },
  { id: "kosoku", cls: "kosoku", name: "高速道路",       w: 3.2 },
  { id: "senyo",  cls: "senyo",  name: "自動車専用道路", w: 2.6 },
  { id: "k1", cls: "kokudo", name: "国道（単独）",   w: 3, n: 1 },
  { id: "k2", cls: "kokudo", name: "国道（二重用）", w: 3, n: 2 },
  { id: "k3", cls: "kokudo", name: "国道（三重用）", w: 3, n: 3 },
  { id: "k4", cls: "kokudo", name: "国道（四重用〜）", w: 3, n: 4 }
];
// 線種。a: 破線パターン（線の太さに対する比率）、cap: 端の形（round で丸い点）、
// double: 二重線（中が抜けた線）、w: 太さの倍率
const DASH = {
  solid:      { name: "実線",             a: [1, 0] },
  thick:      { name: "太い実線",         a: [1, 0], w: 1.6 },
  thin:       { name: "細い実線",         a: [1, 0], w: 0.6 },
  double:     { name: "二重線",           a: [1, 0], double: true },
  doubledash: { name: "二重線（破線）",   a: [3, 1.5], double: true },
  dash:       { name: "破線",             a: [3, 1.5] },
  shortdash:  { name: "細かい破線",       a: [1.5, 1] },
  long:       { name: "長い破線",         a: [6, 2] },
  dot:        { name: "点線（四角）",     a: [1, 1.2] },
  rounddot:   { name: "丸の点線",         a: [0, 2], cap: "round", w: 1.3 },
  roundsparse:{ name: "丸の点線（まばら）", a: [0, 3.5], cap: "round", w: 1.5 },
  dashdot:    { name: "一点鎖線",         a: [4, 1.2, 1, 1.2] },
  dashdotdot: { name: "二点鎖線",         a: [4, 1.2, 1, 1.2, 1, 1.2] },
  dashround:  { name: "破線＋丸",         a: [2.5, 1.8, 0, 1.8], cap: "round" }
};
const dashOf = id => DASH[styleConf[id][1]] || DASH.solid;
const PRESETS = {
  // 標準のカラー
  color: { k1: ["#1f5fbf", "solid"], k2: ["#e8780c", "solid"], k3: ["#d63333", "solid"], k4: ["#8a3fc2", "solid"],
           kosoku: ["#3d4451", "solid"], senyo: ["#7a8494", "solid"], shuyo: ["#1e8a4c", "solid"], ippan: ["#c98a00", "solid"] },
  // 色覚の違いがあっても区別しやすい配色（Okabe-Ito）＋線種
  cud:   { k1: ["#0072b2", "solid"], k2: ["#e69f00", "double"], k3: ["#d55e00", "dashdot"], k4: ["#cc79a7", "rounddot"],
           kosoku: ["#000000", "thick"], senyo: ["#555555", "dashround"], shuyo: ["#009e73", "solid"], ippan: ["#999999", "shortdash"] },
  // 白黒：線種だけで区別
  mono:  { k1: ["#111111", "solid"], k2: ["#111111", "double"], k3: ["#111111", "dashdot"], k4: ["#111111", "rounddot"],
           kosoku: ["#222222", "thick"], senyo: ["#444444", "doubledash"], shuyo: ["#555555", "dash"], ippan: ["#8c8c8c", "shortdash"] },
  // 白黒：丸や点を多めに使ったバリエーション
  mono2: { k1: ["#111111", "thick"], k2: ["#111111", "dashround"], k3: ["#111111", "dashdotdot"], k4: ["#111111", "roundsparse"],
           kosoku: ["#222222", "double"], senyo: ["#444444", "long"], shuyo: ["#555555", "solid"], ippan: ["#8c8c8c", "dot"] }
};
const STORE_KEY = "roadmap-style-v1";
let styleConf = loadStyle();
function loadStyle() {
  const base = { ...structuredClone(PRESETS.color), signColor: "real" };
  try { Object.assign(base, JSON.parse(localStorage.getItem(STORE_KEY) || "{}")); } catch (e) {}
  return base;
}

// ===== オフライン（端末に保存した道路データ） =====
// 道路データ（PMTiles）と索引は、端末の「アプリ専用の保存領域」（OPFS）に保存する。
// 保存していなければ、これまで通りネットから必要な部分だけ読む。
const OFF = {
  dir: null,
  async root() {
    if (!this.dir) this.dir = await navigator.storage.getDirectory();
    return this.dir;
  },
  async file(name) {
    try { return await (await (await this.root()).getFileHandle(name)).getFile(); } catch (e) { return null; }
  },
  async meta() {
    const f = await this.file("meta.json");
    try { return f ? JSON.parse(await f.text()) : null; } catch (e) { return null; }
  },
  async write(name, stream, onBytes) {
    const h = await (await this.root()).getFileHandle(name, { create: true });
    const w = await h.createWritable();
    const reader = stream.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      await w.write(value);
      onBytes && onBytes(value.byteLength);
    }
    await w.close();
  },
  async remove(name) { try { await (await this.root()).removeEntry(name); } catch (e) {} }
};
const offlineSupported = !!(navigator.storage && navigator.storage.getDirectory &&
  window.FileSystemFileHandle && FileSystemFileHandle.prototype.createWritable);

// 端末に保存したファイルから、必要な部分だけを読み出す（PMTilesの読み込み口）
class LocalFileSource {
  constructor(file) { this.file = file; }
  getKey() { return "offline:" + this.file.name; }
  async getBytes(offset, length) { return { data: await this.file.slice(offset, offset + length).arrayBuffer() }; }
}
// 道路タイル：保存してあれば端末のファイル、無ければネット（必要な部分だけ）
let roadsPM = null;
function getRoadsPM() {
  if (!roadsPM) roadsPM = (async () => {
    const meta = offlineSupported ? await OFF.meta() : null;
    const f = meta && meta.complete ? await OFF.file("japan-roads.pmtiles") : null;
    roadsSource = f ? "offline" : "online";
    return new pmtiles.PMTiles(f ? new LocalFileSource(f) : TILES);
  })();
  return roadsPM;
}
let roadsSource = "online";
maplibregl.addProtocol("roadtiles", async (params, abort) => {
  const m = params.url.match(/(\d+)\/(\d+)\/(\d+)$/);
  const pm = await getRoadsPM();
  const t = await pm.getZxy(+m[1], +m[2], +m[3], abort.signal);
  return { data: t ? t.data : new Uint8Array() };
});

// 背景地図・文字データ：一度読んだものは端末に保存し、電波が無くても表示できるようにする
const TILE_CACHE = "map-tiles-v1", TILE_CACHE_MAX = 40000;
let tileCacheCount = 0;
maplibregl.addProtocol("cached", async (params, abort) => {
  const url = "https://" + params.url.slice("cached://".length);
  let cache = null;
  try { cache = await caches.open(TILE_CACHE); } catch (e) {}
  if (cache) {
    const hit = await cache.match(url);
    if (hit) return { data: await hit.arrayBuffer() };
  }
  const res = await fetch(url, { signal: abort.signal });
  if (!res.ok) throw new Error(`${res.status} ${url}`);
  const buf = await res.arrayBuffer();
  if (cache) {
    cache.put(url, new Response(buf.slice(0), { headers: { "Content-Type": res.headers.get("Content-Type") || "application/octet-stream" } })).catch(() => {});
    if (++tileCacheCount % 500 === 0) trimTileCache(cache);
  }
  return { data: buf };
});
async function trimTileCache(cache) {   // 増えすぎたら古いものから消す
  try {
    const keys = await cache.keys();
    if (keys.length > TILE_CACHE_MAX) for (const k of keys.slice(0, keys.length - TILE_CACHE_MAX * 0.8)) await cache.delete(k);
  } catch (e) {}
}

    const tiles = FAC.map(([n, ic], i) => `<div class="${hasFac(p.fac, i) ? "" : "off"}" title="${n}"><b>${ic}</b>${n.replace("・", "<br>")}</div>`).join("");
    new maplibregl.Popup({ maxWidth: "330px" }).setLngLat(e.lngLat).setHTML(
      `<div class="eki"><h4>道の駅 ${esc(p.name)}</h4>` + (p.addr ? `<div class="sub">${esc(p.addr)}</div>` : "") +
      `<div class="fac">${tiles}</div>` +
      (p.hours ? `<div style="font-size:12px">営業時間：${esc(p.hours)}</div>` : "") +
      `<a href="https://www.michi-no-eki.jp/stations/views/${p.id}" target="_blank" rel="noopener">公式ページを開く</a>　` +
      gmap("道の駅 " + p.name) + visitPopupHTML(p.id) + `</div>`
    ).addTo(map);
  });
  map.on("click", "rest", e => {
    const p = e.features[0].properties, kindName = p.kind === "SA" ? "サービスエリア" : "パーキングエリア";
    const [lon, lat] = e.features[0].geometry.coordinates;
    let body = "";
    if (p.fac && p.fac.includes("1")) {
      body = `<div class="fac rest">` + REST_FAC.map(([n, ic], i) =>
        `<div class="${p.fac[i] === "1" ? "" : "off"}"><b>${ic}</b>${n.replace("・", "<br>")}</div>`).join("") + `</div>` +
        `<div style="font-size:11px;color:#5b6577">OpenStreetMapに登録されている設備です</div>`;
    } else {
      body = `<div style="font-size:12px;color:#5b6577;margin:4px 0">設備の情報はOpenStreetMapに登録されていません</div>`;
    }
    new maplibregl.Popup({ maxWidth: "330px" }).setLngLat(e.lngLat).setHTML(
      `<div class="eki"><h4>${esc(p.name || kindName)}</h4><div class="sub">${kindName}</div>${body}${p.name ? gmap(p.name.replace(/SA$/, "サービスエリア").replace(/PA$/, "パーキングエリア")) : ""}</div>`).addTo(map);
  });
  for (const id of ["eki", "rest"]) {
    map.on("mouseenter", id, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", id, () => map.getCanvas().style.cursor = "");
  }
  updateEki();
}
document.getElementById("facChips").innerHTML = FAC.map(([n, ic], i) => `<button data-i="${i}">${ic} ${n}</button>`).join("");
document.getElementById("facChips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const i = +b.dataset.i;
  facFilter.has(i) ? facFilter.delete(i) : facFilter.add(i);
  b.classList.toggle("on", facFilter.has(i));
  updateEki();
});
for (const [cb, ids] of [["showRest", ["rest"]], ["showEki", ["eki"]], ["names", ["name-label"]]])
  document.getElementById(cb).addEventListener("change", e => {
    for (const id of ids) map.setLayoutProperty(id, "visibility", e.target.checked ? "visible" : "none");
  });

// ===== 選択（タイルの keys 属性で絞り込み） =====
const byNum = (a, b) => (parseInt(a.replace(/\D/g, "")) || 9999) - (parseInt(b.replace(/\D/g, "")) || 9999) || a.localeCompare(b);
// 選んだ路線に含まれない道路＝true
function dimExpr() {
  if (!selected.size) return false;
  return ["!", ["any", ...[...selected].map(k => ["in", "|" + k + "|", ["get", "keys"]])]];
}
function stopsFor(c) {
  return c.cls === "ippan" ? [[9, 0.25], [12, 0.6], [14, 1]] : c.cls === "shuyo" ? [[9, 0.75], [12, 1]] : [[7, 1], [16, 1]];
}
function opacityExpr(stops) {
  const d = dimExpr();
  return ["interpolate", ["linear"], ["zoom"], ...stops.flatMap(([z, v]) => [z, ["case", d, 0.08, v]])];
}
const labelFilter = cls => ["all", ["==", ["get", "cls"], cls], ["!=", ["get", "label"], ""], ["!", dimExpr()]];
const nameFilter = () => ["all", ["!=", ["get", "name"], ""], ["!", dimExpr()]];
const glowFilter = () => selected.size ? ["!", dimExpr()] : ["==", 1, 0];
function applyDim() {
  updateChip();
  if (!map.getLayer("line-k1")) return;
  map.setFilter("focus-glow", glowFilter());
  for (const c of CATS) for (const id of ["casing-" + c.id, "line-" + c.id]) {
    map.setPaintProperty(id, "line-opacity", opacityExpr(stopsFor(c)));
    map.setLayoutProperty(id, "line-sort-key", ["case", dimExpr(), 0, 1]);
  }
  for (const cls of ["kokudo", "kosoku", "senyo", "shuyo", "ippan"]) map.setFilter("label-" + cls, labelFilter(cls));
  map.setFilter("name-label", nameFilter());
}


// ===== 路線をたどる（ダブルクリック・ポップアップのボタン） =====
const keysFrom = p => String(p.keys || "").split("|").filter(Boolean);
function keyLabel(k) {
  const i = k.indexOf(":"), g = k.slice(0, i), v = k.slice(i + 1);
  if (g === "国道") return `国道${v}号`;
  if (g === "都道府県道") { const m = v.match(/^(.+?) (\S+)$/); return m ? prefRoad(m[1], m[2]) : prefRoad("", v); }
  return v;
}
function traceButtons(p) {
  const ks = keysFrom(p).filter(k => !k.startsWith("通り名:") || keysFrom(p).length < 4).slice(0, 4);
  if (!ks.length) return "";
  return `<div class="trace">` + ks.map(k => `<button data-trace="${esc(k)}">${esc(keyLabel(k))}をたどる</button>`).join("") + `</div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-trace]");
  if (b) focusRoute(b.dataset.trace);
});
function focusRoute(k) {
  selected.clear(); selected.add(k);
  document.querySelectorAll(".maplibregl-popup").forEach(el => el.remove());
  updateSelection();
  if (!document.getElementById("tab-select").hidden) renderSelectList();
  document.getElementById("fit").click();   // 始点から終点まで見えるように移動
}
function updateChip() {
  const chip = document.getElementById("focusChip");
  chip.hidden = !selected.size;
  document.getElementById("focusText").textContent = [...selected].map(keyLabel).join("・") + " を表示中";
}
document.getElementById("focusClose").addEventListener("click", () => document.getElementById("clear").click());
document.addEventListener("keydown", e => { if (e.key === "Escape" && selected.size) document.getElementById("clear").click(); });

// 検索用の索引（路線番号・通り名 → 範囲）
let INDEX = { groups: {} };
async function loadIndex() {
  try {
    const meta = offlineSupported ? await OFF.meta() : null;
    const f = meta && meta.complete ? await OFF.file("index.json") : null;
    INDEX = f ? JSON.parse(await f.text()) : await (await fetch(INDEX_URL)).json();
    setStatus(`データ更新日：${INDEX.built}（OpenStreetMap）`);
  } catch (e) { setStatus("索引を読み込めませんでした（地図の表示はできます）"); }
  renderSelectList();
  checkOffline(true);
}

// ===== 道路データのダウンロード・更新 =====
const offEl = () => document.getElementById("offline");
const fmtMB = b => (b / 1048576).toFixed(0) + "MB";
let remoteInfo = null;   // { built, size }
async function fetchRemoteInfo() {
  const idx = await (await fetch(INDEX_URL, { cache: "no-store" })).json();
  let size = 0;
  try { size = +(await fetch(TILES, { method: "HEAD", cache: "no-store" })).headers.get("Content-Length") || 0; } catch (e) {}
  return { built: idx.built, size };
}
async function checkOffline(first) {
  const el = offEl();
  if (!offlineSupported) { el.innerHTML = `<div class="empty">この端末では道路データを保存できません（ネットから表示します）</div>`; return; }
  const meta = await OFF.meta();
  try { remoteInfo = await fetchRemoteInfo(); } catch (e) { remoteInfo = null; }
  let html = "";
  if (meta && meta.complete) {
    html = `<div class="offinfo">端末に保存済み：${meta.built}（${fmtMB(meta.size)}）<br>${roadsSource === "offline" ? "電波が無くても道路を表示できます" : ""}</div>`;
    if (remoteInfo && remoteInfo.built > meta.built)
      html += `<button class="btn primary" data-off="download">新しいデータ（${remoteInfo.built}）に更新${remoteInfo.size ? "・" + fmtMB(remoteInfo.size) : ""}</button>`;
    html += `<button class="btn" data-off="delete">保存した道路データを削除</button>`;
  } else {
    html = `<div class="offinfo">道路データは毎回ネットから読み込んでいます。保存すると速くなり、電波が無くても表示できます。</div>` +
      (remoteInfo ? `<button class="btn primary" data-off="download">道路データを保存${remoteInfo.size ? "（" + fmtMB(remoteInfo.size) + "・Wi-Fi推奨）" : ""}</button>` : "");
  }
  html += `<button class="btn" data-off="clearcache">保存した背景地図を削除</button>`;
  el.innerHTML = html;
  // アプリでは初回起動時に保存を提案する
  if (first && IS_APP && !(meta && meta.complete) && remoteInfo && !localStorage.getItem("offlineAsked")) {
    try { localStorage.setItem("offlineAsked", "1"); } catch (e) {}
    if (confirm(`道路データ（${remoteInfo.size ? fmtMB(remoteInfo.size) : "約100〜300MB"}）を端末に保存しますか？\n保存すると表示が速くなり、電波が無くても道路を表示できます。\nWi-Fiでの保存をおすすめします。`)) downloadOffline();
  }
}
async function downloadOffline() {
  const el = offEl();
  try {
    el.innerHTML = `<div class="offinfo">準備中…</div><progress id="offprog" max="1" value="0" style="width:100%"></progress>`;
    try { await navigator.storage.persist(); } catch (e) {}   // 端末の容量が少なくなっても消されにくくする
    const info = remoteInfo || await fetchRemoteInfo();
    await OFF.write("meta.json", new Blob([JSON.stringify({ complete: false })]).stream());
    const idxRes = await fetch(INDEX_URL, { cache: "no-store" });
    await OFF.write("index.json", idxRes.body);
    const res = await fetch(TILES, { cache: "no-store" });
    if (!res.ok) throw new Error("download " + res.status);
    const total = +res.headers.get("Content-Length") || info.size || 0;
    let got = 0;
    const prog = document.getElementById("offprog");
    await OFF.write("japan-roads.pmtiles", res.body, n => {
      got += n;
      if (total) { prog.value = got / total; }
      el.querySelector(".offinfo").textContent = `道路データを保存中… ${fmtMB(got)}${total ? " / " + fmtMB(total) : ""}`;
    });
    await OFF.write("meta.json", new Blob([JSON.stringify({ complete: true, built: info.built, size: got })]).stream());
    el.innerHTML = `<div class="offinfo">保存しました。切り替えのため再読み込みします…</div>`;
    setTimeout(() => location.reload(), 800);
  } catch (e) {
    console.error(e);
    await OFF.remove("meta.json");
    el.innerHTML = `<div class="offinfo">保存できませんでした（${esc(e.message || e)}）。空き容量と電波を確認して、もう一度お試しください。</div>`;
    setTimeout(() => checkOffline(false), 4000);
  }
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-off]");
  if (!b) return;
  const act = b.dataset.off;
  if (act === "download") downloadOffline();
  if (act === "delete" && confirm("保存した道路データを削除しますか？（ネットから読む方式に戻ります）")) {
    for (const n of ["meta.json", "japan-roads.pmtiles", "index.json"]) await OFF.remove(n);
    location.reload();
  }
  if (act === "clearcache") { try { await caches.delete(TILE_CACHE); } catch (e) {} b.textContent = "背景地図を削除しました"; }
});
// 今の画面に見えている道路の keys
function visibleKeys() {
  const set = new Set();
  for (const f of map.querySourceFeatures("roads", { sourceLayer: "roads" }))
    for (const k of String(f.properties.keys || "").split("|")) if (k) set.add(k);
  return set;
}

// ===== 道路を選択 =====
const listEl = document.getElementById("sellist");
const qEl = document.getElementById("q");
function renderSelectList() {
  const q = qEl.value.trim();
  const isNum = /^[0-9A-Za-z]+$/.test(q);
  const vis = q ? null : visibleKeys();
  let html = "";
  for (const g of ["国道", "都道府県道", "高速道路", "通り名"]) {
    const all = Object.keys(INDEX.groups[g] || {});
    let refs;
    if (!q) {
      // 何も入れていないとき：今の画面に見えている路線（通り名は除く）＋選択中
      refs = all.filter(r => selected.has(g + ":" + r) || (g !== "通り名" && vis.has(g + ":" + r)));
    } else if (g === "通り名") {
      refs = isNum ? [] : all.filter(r => r.includes(q));
    } else if (g === "都道府県道") {
      // 「64」なら全国の64号、「千葉」なら千葉県の県道
      refs = all.filter(r => isNum ? r.split(" ").pop().startsWith(q) : r.startsWith(q));
    } else {
      refs = isNum ? all.filter(r => r.startsWith(q)) : [];
    }
    refs = [...new Set([...refs, ...all.filter(r => selected.has(g + ":" + r))])];
    refs.sort(g === "通り名" ? (a, b) => a.length - b.length || a.localeCompare(b, "ja")
      : g === "都道府県道" ? (a, b) => a.split(" ")[0].localeCompare(b.split(" ")[0], "ja") || byNum(a.split(" ").pop(), b.split(" ").pop())
      : byNum);
    const more = refs.length > 120;
    refs = refs.slice(0, 120);
    if (!refs.length) continue;
    html += `<h2>${g}</h2><div class="${g === "通り名" || g === "都道府県道" ? "names" : "grid"}">` + refs.map(r => {
      const k = g + ":" + r;
      return `<label><input type="checkbox" value="${esc(k)}"${selected.has(k) ? " checked" : ""}>${esc(r)}</label>`;
    }).join("") + "</div>" + (more ? `<div class="empty">ほかにもあります。絞り込んでください</div>` : "");
  }
  if (!q) html += `<div class="empty">今の画面にある路線を表示しています。番号・県名・通り名を入れると全国から探せます</div>`;
  listEl.innerHTML = html || `<div class="empty">該当する路線がありません</div>`;
}
map.on("moveend", debounce(() => { if (!document.getElementById("tab-select").hidden && !qEl.value.trim()) renderSelectList(); }, 400));
listEl.addEventListener("change", e => {
  if (e.target.checked) selected.add(e.target.value); else selected.delete(e.target.value);
  updateSelection();
});
qEl.addEventListener("input", renderSelectList);
document.getElementById("clear").addEventListener("click", () => { selected.clear(); updateSelection(); renderSelectList(); });
document.getElementById("fit").addEventListener("click", () => {
  if (!selected.size) return;
  const b = new maplibregl.LngLatBounds();
  for (const k of selected) {
    const i = k.indexOf(":"), bb = (INDEX.groups[k.slice(0, i)] || {})[k.slice(i + 1)];
    if (bb) { b.extend([bb[0], bb[1]]); b.extend([bb[2], bb[3]]); }
  }
  if (!b.isEmpty()) map.fitBounds(b, { padding: 60, maxZoom: 14 });
});
function updateSelection() {
  const c = document.getElementById("selcount");
  c.hidden = !selected.size; c.textContent = selected.size;
  applyDim();
}

// ===== UI =====
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  for (const t of ["view", "select", "record", "style"]) document.getElementById("tab-" + t).hidden = b.dataset.tab !== t;
  if (b.dataset.tab === "select") renderSelectList();
}));
document.querySelectorAll("input[data-cls]").forEach(cb => cb.addEventListener("change", () => {
  const v = cb.checked ? "visible" : "none", cls = cb.dataset.cls;
  for (const c of CATS.filter(c => c.cls === cls))
    for (const id of ["casing-", "line-"]) map.setLayoutProperty(id + c.id, "visibility", v);
  map.setLayoutProperty("label-" + cls, "visibility", v === "visible" && document.getElementById("labels").checked ? "visible" : "none");
}));
document.getElementById("endpoints").addEventListener("change", e => {
  for (const id of ["endpoint", "endpoint-label"]) map.setLayoutProperty(id, "visibility", e.target.checked ? "visible" : "none");
});
document.getElementById("overlap").addEventListener("change", e =>
  map.setLayoutProperty("junction", "visibility", e.target.checked ? "visible" : "none"));
document.getElementById("labels").addEventListener("change", e => {
  for (const c of ["kosoku", "senyo", "kokudo", "shuyo", "ippan"]) {
    const on = e.target.checked && document.querySelector(`input[data-cls=${c}]`).checked;
    map.setLayoutProperty("label-" + c, "visibility", on ? "visible" : "none");
  }
});
document.getElementById("toggle").addEventListener("click", e => {
  const p = document.getElementById("panel");
  p.classList.toggle("collapsed");
  e.target.textContent = p.classList.contains("collapsed") ? "▲" : "▼";
});

// ===== 配色 =====
function swatchSvg(id) {
  const color = styleConf[id][0], d = dashOf(id);
  const sw = 2.4 * (d.w || 1) * (d.double ? 0.5 : 1);
  const da = d.a[1] === 0 ? "" : ` stroke-dasharray="${d.a.map(x => x * sw).join(" ")}"`;
  const line = y => `<line x1="1" y1="${y}" x2="27" y2="${y}" stroke="${color}" stroke-width="${sw}" stroke-linecap="${d.cap || "butt"}"${da}/>`;
  return `<svg class="sw" viewBox="0 0 28 10">${d.double ? line(2.5) + line(7.5) : line(5)}</svg>`;
}
function renderLegend() { document.querySelectorAll("[data-sw]").forEach(el => el.innerHTML = swatchSvg(el.dataset.sw)); }
function renderStyleRows() {
  const order = ["k1", "k2", "k3", "k4", "shuyo", "ippan", "kosoku", "senyo"];
  document.getElementById("stylerows").innerHTML = order.map(id => {
    const c = CATS.find(x => x.id === id), [color, dash] = styleConf[id];
    const opts = Object.entries(DASH).map(([k, d]) => `<option value="${k}"${k === dash ? " selected" : ""}>${d.name}</option>`).join("");
    return `<div class="stylerow" data-id="${id}"><span>${swatchSvg(id)} ${c.name}</span>
      <input type="color" value="${color}" aria-label="${c.name}の色"><select aria-label="${c.name}の線種">${opts}</select></div>`;
  }).join("");
}
function applyStyle() {
  saveStyle();
  renderLegend();
  if (!map.getLayer("line-k1")) return;
  signVersion++;
  for (const cls of ["kokudo", "kosoku", "senyo", "shuyo", "ippan"]) map.setLayoutProperty("label-" + cls, "icon-image", signExpr(cls));
  for (const c of CATS) {
    const lp = linePaint(c), id = "line-" + c.id;
    map.setPaintProperty(id, "line-color", styleConf[c.id][0]);
    map.setPaintProperty(id, "line-dasharray", lp.a);
    map.setPaintProperty(id, "line-width", lp.w);
    map.setPaintProperty(id, "line-gap-width", lp.gap);
    map.setLayoutProperty(id, "line-cap", lp.cap);
    map.setPaintProperty("casing-" + c.id, "line-width", lp.casing);
  }
  map.setPaintProperty("endpoint", "circle-stroke-color", styleConf.k1[0]);
  map.setPaintProperty("endpoint-label", "text-color", styleConf.k1[0]);
}
document.getElementById("stylerows").addEventListener("input", e => {
  const row = e.target.closest(".stylerow"); if (!row) return;
  const id = row.dataset.id;
  if (e.target.type === "color") styleConf[id][0] = e.target.value; else styleConf[id][1] = e.target.value;
  row.querySelector("svg").outerHTML = swatchSvg(id);
  applyStyle();
});
document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
  // 白黒プリセットは標識も白黒（線の色）に、カラー系は本物の標識の色に
  styleConf = { ...structuredClone(PRESETS[b.dataset.preset]), signColor: /^mono/.test(b.dataset.preset) ? "line" : "real" };
  document.getElementById("signColor").value = styleConf.signColor;
  renderStyleRows(); applyStyle();
}));
document.getElementById("signColor").value = styleConf.signColor;
document.getElementById("signColor").addEventListener("change", e => { styleConf.signColor = e.target.value; applyStyle(); });
renderLegend();
renderStyleRows();

function esc(t) { return String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
// アプリとしてインストールできるように Service Worker を登録
if ("serviceWorker" in navigator && !IS_APP) navigator.serviceWorker.register("sw.js").catch(() => {});

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
</script>
